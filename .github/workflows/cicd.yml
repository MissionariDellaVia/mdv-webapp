# This is a basic workflow to help you get started with Actions

name: cicd-develop

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  gh-pages-deploy:
    name: Deploying to Github Pages
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - uses: fregante/setup-git-user@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Runs install and build
      - name: Install packages
        run: npm install

      # Le VUE_APP_* non sono committate nel repo: si generano qui dai GitHub Secrets.
      # (Sono valori client, finiscono nel bundle pubblico; i Secrets evitano di tenerli nel repo.)
      - name: Create .env from secrets
        run: |
          {
            echo "VUE_APP_SUPABASE_URL=${{ secrets.VUE_APP_SUPABASE_URL }}"
            echo "VUE_APP_SUPABASE_ANON_KEY=${{ secrets.VUE_APP_SUPABASE_ANON_KEY }}"
            echo "VUE_APP_API_BLOG_BASE_URL=${{ secrets.VUE_APP_API_BLOG_BASE_URL }}"
            echo "VUE_APP_BLOG_API_KEY=${{ secrets.VUE_APP_BLOG_API_KEY }}"
          } > .env

      - name: Deploy 🚀
        run: npm run deploy

